version: '3.8'

services:

  # ================================
  # PHP Laravel App
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: marketing_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - marketing_network
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  # ================================
  # Nginx Web Server
  # ================================
  nginx:
    image: nginx:alpine
    container_name: marketing_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - marketing_network
    depends_on:
      - app

  # ================================
  # MySQL Database
  # ================================
  db:
    image: mysql:8.0
    container_name: marketing_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: marketing_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: marketing_user
      MYSQL_PASSWORD: marketing_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - marketing_network

  # ================================
  # Redis Cache
  # ================================
  redis:
    image: redis:alpine
    container_name: marketing_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - marketing_network

# ================================
# Volumes
# ================================
volumes:
  db_data:
    driver: local

# ================================
# Networks
# ================================
networks:
  marketing_network:
    driver: bridge
